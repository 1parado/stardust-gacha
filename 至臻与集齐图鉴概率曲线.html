<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">抽卡累计概率曲线：集齐图鉴的瓶颈几乎完全取决于是否抽中至臻。</h2>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:1.25rem;">
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem;">
    <div style="font-size:13px;color:var(--color-text-secondary);">至臻单抽概率</div>
    <div style="font-size:24px;font-weight:500;margin-top:4px;">0.01%</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem;">
    <div style="font-size:13px;color:var(--color-text-secondary);">至臻期望抽数</div>
    <div style="font-size:24px;font-weight:500;margin-top:4px;">10,000</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem;">
    <div style="font-size:13px;color:var(--color-text-secondary);">集齐 61 张期望</div>
    <div style="font-size:24px;font-weight:500;margin-top:4px;">~10,149</div>
  </div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:8px;font-size:12px;color:var(--color-text-secondary);">
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#BA7517;"></span>集齐 61 张（≈ 抽中至臻）</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:2px;background:#888780;"></span>集齐其余 60 张（虚线）</span>
</div>
<div style="position:relative;width:100%;height:300px;">
  <canvas id="probChart" role="img" aria-label="累计概率折线图：抽中至臻与集齐图鉴的概率随抽数上升，1000 抽约 9.5%，10000 抽约 63%，50000 抽约 99.3%；集齐其余 60 张在约 3000 抽时接近 100%。">抽中至臻：1000 抽 9.5%，5000 抽 39.3%，10000 抽 63.2%，50000 抽 99.3%。集齐其余 60 张约 3000 抽接近 100%。</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){
  var dark = matchMedia('(prefers-color-scheme: dark)').matches;
  var tick = dark ? '#B4B2A9' : '#5F5E5A';
  var grid = dark ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.08)';
  new Chart(document.getElementById('probChart'), {
    type: 'line',
    data: {
      labels: ['1k','3k','5k','1万','1.5万','2万','3万','5万'],
      datasets: [
        { label:'集齐 61 张', data:[4.7,25.9,39.3,63.2,77.7,86.5,95.0,99.3], borderColor:'#BA7517', backgroundColor:'#BA7517', pointRadius:3, pointStyle:'circle', borderWidth:2, tension:.25 },
        { label:'集齐其余 60 张', data:[49.3,99.8,100,100,100,100,100,100], borderColor:'#888780', backgroundColor:'transparent', pointRadius:2, pointStyle:'rect', borderWidth:1.5, borderDash:[5,4], tension:.25 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(c){ return c.dataset.label+': '+c.parsed.y+'%'; } } } },
      scales:{
        x:{ ticks:{color:tick,autoSkip:false,maxRotation:0}, grid:{color:grid}, title:{display:true,text:'累计抽数',color:tick,font:{size:12,weight:'400'}} },
        y:{ min:0,max:100, ticks:{color:tick,callback:function(v){return v+'%';}}, grid:{color:grid} }
      }
    }
  });
})();
</script>
