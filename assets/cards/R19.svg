<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1075" width="768" height="1075">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#22323F"/>
      <stop offset="1" stop-color="#0E161C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#9CC7E8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9CC7E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <rect width="768" height="1075" fill="url(#bg)"/>
  <rect width="768" height="1075" fill="url(#glow)"/>
  <circle cx="384" cy="470" r="140" fill="none"
             stroke="#9CC7E8" stroke-width="0.8" opacity="0.22"/><circle cx="384" cy="470" r="169" fill="none"
             stroke="#9CC7E8" stroke-width="0.8" opacity="0.18"/><circle cx="384" cy="470" r="230" fill="none"
             stroke="#9CC7E8" stroke-width="0.8" opacity="0.15"/><circle cx="384" cy="470" r="265" fill="none"
             stroke="#9CC7E8" stroke-width="0.8" opacity="0.11"/><circle cx="384" cy="470" r="317" fill="none"
             stroke="#9CC7E8" stroke-width="0.8" opacity="0.08"/>

  <!-- 主体轮廓：真美术会画在这里 -->
  <g stroke="#9CC7E8" fill="none" opacity="0.55">
    <circle cx="384" cy="450" r="128" stroke-width="1.6"/>
    <path d="M384 322 C 470 380 470 520 384 578 C 298 520 298 380 384 322 Z" stroke-width="1.2"/>
  </g>

  <!-- 底部渐变，给角色名留位置 -->
  <rect y="620" width="768" height="455" fill="url(#fade)"/>

  <text x="384" y="452" text-anchor="middle" fill="#9CC7E8" opacity="0.85"
        font-family="sans-serif" font-size="40" letter-spacing="6">占位</text>
  <text x="384" y="920" text-anchor="middle" fill="#FFF8DC"
        font-family="sans-serif" font-size="58" font-weight="700" letter-spacing="14">朔主</text>
  <text x="384" y="972" text-anchor="middle" fill="#9CC7E8" opacity="0.7"
        font-family="sans-serif" font-size="26" letter-spacing="10">NO.019</text>
</svg>
